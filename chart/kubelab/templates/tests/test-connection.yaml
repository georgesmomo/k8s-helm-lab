# "helm test <release>" runs this pod: it calls the Service and checks the answer.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kubelab.fullname" . }}-test
  labels:
    {{- include "kubelab.labels" . | nindent 4 }}
    role: client
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation   # keep the pod so its logs can be read (helm test --logs)
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: check
      image: {{ include "kubelab.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: ["check", "http://{{ include "kubelab.fullname" . }}:{{ .Values.service.port }}/", {{ .Values.message | quote }}]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
