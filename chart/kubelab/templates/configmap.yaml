apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubelab.fullname" . }}
  labels:
    {{- include "kubelab.labels" . | nindent 4 }}
data:
  MESSAGE: {{ .Values.message | quote }}
  {{- range $file, $content := .Values.config }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
