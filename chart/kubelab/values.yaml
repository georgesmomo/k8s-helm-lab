# Default values. Override per environment: -f values-prod.yaml or --set key=value.

replicaCount: 2

image:
  repository: kubelab
  tag: ""                 # empty = .Chart.AppVersion
  pullPolicy: IfNotPresent
  digest: ""              # e.g. sha256:... (wins over the tag when set)

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

message: "Bonjour depuis Helm"
config:
  app.properties: |
    log.level=info
    feature.newCheckout=false

# Secret: either created by the chart (dev) or pre-existing (prod, managed by External Secrets).
secret:
  create: true
  existingSecret: ""
  databaseUrl: "postgres://kubelab:change-me@db:5432/kubelab"

serviceAccount:
  create: true
  name: ""
  annotations: {}         # e.g. IRSA / Workload Identity: cloud role bound to the ServiceAccount
  automountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

probes:
  startup:  {path: /healthz, periodSeconds: 2, failureThreshold: 30}
  readiness: {path: /readyz, periodSeconds: 5}
  liveness: {path: /healthz, periodSeconds: 10, failureThreshold: 3}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  allowFromNamespaces: []   # e.g. [gateway-system]

httpRoute:
  enabled: false
  gateway: {name: public, namespace: gateway-system}
  hostnames: []

migrations:
  enabled: true             # pre-install/pre-upgrade hook: migration Job before the new pods

nodeSelector: {}
tolerations: []
affinity: {}
topologySpread: true
