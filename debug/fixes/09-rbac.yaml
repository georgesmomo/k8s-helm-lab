apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-reader, namespace: debug}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: reader-can-read-pods, namespace: debug}
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: debug
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
