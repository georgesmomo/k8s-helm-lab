# Symptom: regular restarts although the app is fine. Cause: an aggressive liveness probe
# (1 s timeout, no startupProbe) on an app that takes 8 s to start.
apiVersion: apps/v1
kind: Deployment
metadata: {name: slow-start, namespace: debug}
spec:
  replicas: 1
  selector: {matchLabels: {app: slow-start}}
  template:
    metadata: {labels: {app: slow-start}}
    spec:
      containers:
        - name: app
          image: kubelab:1.0.0
          env: [{name: STARTUP_DELAY_SECONDS, value: "8"}]
          livenessProbe:
            httpGet: {path: /readyz, port: 8080}   # mistake: liveness on /readyz
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 2
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
