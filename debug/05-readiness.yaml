# Symptôme : Running mais READY 0/1, le Service n'envoie aucun trafic. Cause : mauvais chemin de sonde.
apiVersion: apps/v1
kind: Deployment
metadata: {name: not-ready, namespace: debug}
spec:
  replicas: 1
  selector: {matchLabels: {app: not-ready}}
  template:
    metadata: {labels: {app: not-ready}}
    spec:
      containers:
        - name: app
          image: kubelab:1.0.0
          readinessProbe:
            httpGet: {path: /ready, port: 8080}     # l'app expose /readyz
            periodSeconds: 3
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
