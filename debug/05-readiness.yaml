# Symptom: Running but READY 0/1, the Service sends no traffic. Cause: wrong probe path.
apiVersion: apps/v1
kind: Deployment
metadata: {name: not-ready, namespace: debug}
spec:
  replicas: 1
  selector: {matchLabels: {app: not-ready}}
  template:
    metadata: {labels: {app: not-ready}}
    spec:
      containers:
        - name: app
          image: kubelab:1.0.0
          readinessProbe:
            httpGet: {path: /ready, port: 8080}     # the app exposes /readyz
            periodSeconds: 3
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
