# HTTP exposure with the Gateway API (the successor of Ingress). Requires a controller
# (Envoy Gateway, Traefik, Cilium, NGINX Gateway Fabric...) and a Gateway named "public".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubelab
  namespace: kubelab
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames: ["kubelab.localtest.me"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: kubelab
          port: 80
