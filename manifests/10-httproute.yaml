# Exposition HTTP avec la Gateway API (successeur d'Ingress). Nécessite un contrôleur
# (Envoy Gateway, Traefik, Cilium, NGINX Gateway Fabric…) et une Gateway nommée "public".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubelab
  namespace: kubelab
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames: ["kubelab.localtest.me"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: kubelab
          port: 80
