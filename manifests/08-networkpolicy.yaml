# Zero-trust networking: deny all ingress, then open only what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kubelab
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-to-kubelab
  namespace: kubelab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubelab
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubelab
          podSelector:
            matchLabels:
              role: client
      ports:
        - port: 8080
          protocol: TCP
