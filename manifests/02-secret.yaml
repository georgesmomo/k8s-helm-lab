# Exemple pédagogique. En entreprise, ne committe JAMAIS un Secret en clair :
# External Secrets Operator (Vault, AWS/GCP Secret Manager) ou Sealed Secrets/SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: kubelab-secret
  namespace: kubelab
  labels:
    app.kubernetes.io/name: kubelab
type: Opaque
stringData:
  DATABASE_URL: "postgres://kubelab:change-me@db.kubelab.svc:5432/kubelab"
