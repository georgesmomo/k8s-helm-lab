# Teaching example only. In a real company NEVER commit a plain-text Secret:
# use External Secrets Operator (Vault, AWS/GCP Secret Manager) or Sealed Secrets/SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: kubelab-secret
  namespace: kubelab
  labels:
    app.kubernetes.io/name: kubelab
type: Opaque
stringData:
  DATABASE_URL: "postgres://kubelab:change-me@db.kubelab.svc:5432/kubelab"
