apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelab
  namespace: kubelab
  labels:
    app.kubernetes.io/name: kubelab
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: k8s-helm-lab
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:                      # immutable after creation: must match the template labels
      app.kubernetes.io/name: kubelab
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0               # never fewer than 3 ready pods during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubelab
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: kubelab
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:      # spread the replicas across nodes
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubelab
      containers:
        - name: kubelab
          image: kubelab:1.0.0   # loaded into kind; in a company: private registry + immutable tag or digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: kubelab-config
                  key: MESSAGE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubelab-secret
                  key: DATABASE_URL
            - name: CONFIG_FILE
              value: /etc/kubelab/app.properties
            - name: POD_NAME              # Downward API: the pod knows its name and node
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:                     # what the scheduler reserves
              cpu: 50m
              memory: 32Mi
            limits:                       # ceiling: above the memory limit, OOMKilled
              memory: 128Mi
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:                 # removes the pod from the Service when it fails
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:                  # restarts the container when it fails
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/kubelab
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubelab-config
            items:
              - key: app.properties
                path: app.properties
