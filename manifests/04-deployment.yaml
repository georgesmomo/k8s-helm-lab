apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelab
  namespace: kubelab
  labels:
    app.kubernetes.io/name: kubelab
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: k8s-helm-lab
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:                      # immuable après création : doit matcher les labels du template
      app.kubernetes.io/name: kubelab
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0               # jamais moins de 3 pods prêts pendant une mise à jour
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubelab
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: kubelab
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:      # répartir les réplicas sur les nœuds
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubelab
      containers:
        - name: kubelab
          image: kubelab:1.0.0   # chargée dans kind ; en entreprise : registre privé + tag immuable ou digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: kubelab-config
                  key: MESSAGE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubelab-secret
                  key: DATABASE_URL
            - name: CONFIG_FILE
              value: /etc/kubelab/app.properties
            - name: POD_NAME              # Downward API : le pod connaît son nom et son nœud
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:                     # ce que le scheduler réserve
              cpu: 50m
              memory: 32Mi
            limits:                       # plafond : au-delà de la mémoire, OOMKilled
              memory: 128Mi
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:                 # retire le pod du Service s'il échoue
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:                  # redémarre le conteneur s'il échoue
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/kubelab
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubelab-config
            items:
              - key: app.properties
                path: app.properties
