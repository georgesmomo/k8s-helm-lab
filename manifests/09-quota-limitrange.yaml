# Namespace guardrails: an overall ceiling (quota) and per-container defaults (LimitRange).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kubelab-quota
  namespace: kubelab
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kubelab-defaults
  namespace: kubelab
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 32Mi
      default:
        memory: 128Mi
      max:
        memory: 1Gi
