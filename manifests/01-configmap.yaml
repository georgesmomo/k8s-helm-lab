# Non-sensitive configuration: injected as environment variables and mounted as a file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubelab-config
  namespace: kubelab
  labels:
    app.kubernetes.io/name: kubelab
data:
  MESSAGE: "Bonjour depuis Kubernetes"
  app.properties: |
    log.level=info
    feature.newCheckout=false
