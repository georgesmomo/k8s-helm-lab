# Un namespace par application et par environnement : isolation des droits, quotas et politiques réseau.
apiVersion: v1
kind: Namespace
metadata:
  name: kubelab
  labels:
    # Pod Security Admission : refuse les pods privilégiés, root, hostPath…
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
