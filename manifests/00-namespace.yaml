# One namespace per application and environment: isolates permissions, quotas and network policies.
apiVersion: v1
kind: Namespace
metadata:
  name: kubelab
  labels:
    # Pod Security Admission: rejects privileged pods, root, hostPath...
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
