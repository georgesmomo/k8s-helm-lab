# kubectl apply -k manifests/  (Kustomize is built into kubectl)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubelab
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - 03-serviceaccount.yaml
  - 04-deployment.yaml
  - 05-service.yaml
  - 06-pdb.yaml
  - 07-hpa.yaml
  - 08-networkpolicy.yaml
  - 09-quota-limitrange.yaml
