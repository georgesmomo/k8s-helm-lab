# Stable address (virtual IP + DNS name kubelab.kubelab.svc.cluster.local) in front of the ready pods.
apiVersion: v1
kind: Service
metadata:
  name: kubelab
  namespace: kubelab
  labels:
    app.kubernetes.io/name: kubelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubelab
  ports:
    - name: http
      port: 80
      targetPort: http
