# Same topology as kind/cluster.yaml, plus adjustments for the sandbox used to capture the course outputs:
# cgroup v1 host (failCgroupV1: false), no CAP_SYS_RESOURCE (restrict_oom_score_adj)
# and a local registry mirror (no Docker Hub access there). Use kind/cluster.yaml on your machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
  - role: worker
  - role: worker
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
  - |-
    [plugins."io.containerd.grpc.v1.cri"]
      restrict_oom_score_adj = true
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    failCgroupV1: false
