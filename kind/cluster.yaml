# kind create cluster --name lab --config kind/cluster.yaml
# 1 control plane + 2 workers: enough to see scheduling, drains and PDBs in action.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:            # HTTP access from your machine to the cluster (NodePort 30080)
      - containerPort: 30080
        hostPort: 8080
  - role: worker
  - role: worker
